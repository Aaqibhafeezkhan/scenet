version: 2

# The CI actions in this repository were, before this file existed, a full major
# version behind across the board -- and on a Node runtime GitHub was about to remove.
# Nothing told anyone. That is what this is for.
#
# Every group below says `applies-to: version-updates`, which is also the default when it
# is left out: a group, and the `update-types` inside it, shapes the weekly routine
# updates only. A security update is never put in a group here, so it opens its own pull
# request, and it is never held to `[minor, patch]` -- it may cross a major version. The
# job definition Dependabot logs for each security run shows it, `"dependency-groups":[]`.
#
# What does reach a security update is `ignore` (the `@types/vscode` rule below is in
# every editor security job), and the version ranges of the packages that pull a
# vulnerable one in. A fix no parent's range admits cannot be proposed by any
# configuration: the run fails, the alert stays open, and docs/maintainer/dependencies.md
# says what to do then.
updates:
  # Actions are pinned to commit SHAs for supply-chain safety, which makes them
  # invisible to a human reading the file. Dependabot understands the `# vX.Y.Z`
  # comment convention and updates both the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directory: /playground
    schedule:
      interval: weekly
    groups:
      playground:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
    ignore:
      # monaco-editor 0.55 replaced its wildcard exports map and 0.56 changed the worker
      # `initialize` contract. `monaco-worker-manager`, which monaco-yaml depends on,
      # still uses the old deep import path -- so on 0.55+ the YAML worker never
      # registers a handler and schema validation, completion and hover silently stop
      # working. The page still loads, which is what makes it worth pinning.
      #
      # Narrow on purpose: each new minor is still proposed, and monaco-yaml updates are
      # unaffected -- and monaco-yaml is where the fix has to come from. 0.57 was
      # proposed and merged with every check green, because CI typechecked the
      # playground but never built it, and the first thing to fail was the Pages deploy.
      # CI builds it now, so a release that breaks the import path fails its own pull
      # request. One that only breaks the worker contract still passes; see
      # playground/README.md.
      - dependency-name: monaco-editor
        versions: ["0.55.x", "0.56.x", "0.57.x"]

  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
    groups:
      editor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
    ignore:
      # `@types/vscode` is the API the extension compiles against, so it has to stay at
      # the oldest VS Code `engines.vscode` admits -- `vsce package` refuses otherwise,
      # and the extension could call API those versions lack. Dependabot raised it to
      # ^1.136.0 against an engine of ^1.100.0, which broke packaging while every check
      # stayed green. Raise the two together, on purpose, never one alone.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
