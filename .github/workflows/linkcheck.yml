name: Link check

# Weekly, and on demand. Deliberately NOT part of CI: external links rot on somebody
# else's schedule, and a pull request should not fail because an unrelated site is down
# for maintenance. But rotted links in published documentation are still a real defect,
# so something has to look.
#
# This exists because of a bug it would have caught. MyST's linkify extension treats
# anything shaped like a domain as a URL, and `.id`, `.by`, `.at`, `.name`, `.ir` and
# `.cy` are all real top-level domains -- so every `CoreActor.id` and `SayEvent.by` in
# the API reference shipped as a live hyperlink to a stranger's website. The HTML build
# was clean; only linkcheck saw it.

on:
  schedule:
    # Mondays, 07:00 UTC. Early enough in the week to be worth acting on.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    # Both are for showing the report of a scheduled run working, on any branch: two runs
    # with both set open one issue and comment on it, and one with `report` alone closes it.
    inputs:
      force-failure:
        description: "Fail at once, without checking a link"
        type: boolean
        default: false
      report:
        description: "Report the result as a scheduled run does: open, comment on or close its issue"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linkcheck:
    name: Documentation links
    runs-on: ubuntu-26.04
    steps:
      - name: Fail on request
        if: inputs.force-failure
        run: |
          echo "::error::Failed on request (force-failure), to test the report of a scheduled run."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - run: uv sync --frozen --group docs

      - name: Check every link in the documentation
        run: uv run sphinx-build -b linkcheck docs docs/_linkcheck

      - name: Report
        if: always()
        run: |
          if [ -f docs/_linkcheck/output.txt ]; then
            echo '### Link check' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'broken|redirect' docs/_linkcheck/output.txt >> "$GITHUB_STEP_SUMMARY" || \
              echo 'no broken links' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # A scheduled run's failure opens an issue, and its next success closes it. A dispatched
  # run reports only when asked to, so trying the check on a branch cannot close the issue
  # a failing week opened.
  report:
    name: Report the scheduled run
    needs: [linkcheck]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.report) }}
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-report.yml
    with:
      results: ${{ join(needs.*.result, ' ') }}
