name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `main` has no merge queue: one was tried and removed on purpose. The event stays so
  # that turning one back on needs no change here -- a queue waits for the required
  # checks on the commit it builds, and only this event produces them there. Without it
  # every entry would wait forever.
  merge_group:
  workflow_dispatch:

# Least privilege by default. A job that needs more says so itself; nothing here does.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv resolves and installs the Python version itself, pinned by .python-version.
  UV_FROZEN: "1"

# Every third-party action is pinned to a full commit SHA with the tag in a comment.
# A mutable tag can be re-pointed at different code by whoever controls the repository,
# which is the standard supply-chain attack on Actions; a SHA cannot. Dependabot keeps
# these current -- see .github/dependabot.yml.

jobs:
  check:
    name: Lint, types and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor and is not decoration. Before Python 3.14 and PEP 649,
        # annotations are evaluated eagerly, so a self-referential `-> Point` inside
        # `class Point` raises NameError at import. Developing only on 3.14 hides that
        # entirely -- it surfaced first in the browser, where Pyodide ran an older
        # Python. This job is what stops it coming back.
        #
        # 3.13 sits between them and has nothing of its own to catch, but pyproject.toml
        # lists it to PyPI as supported, and a promise is only kept if something checks it.
        # tests/test_workflows.py holds this list to the classifiers.
        python: ["3.12", "3.13", "3.14"]
    # Every uv command in the job, not only the sync. Left to itself, `uv run` reads
    # .python-version (3.14), finds the 3.12 environment the sync made, and replaces it
    # with a 3.14 one holding the default groups only -- so this job ran its tests on
    # 3.14 and the floor went untested.
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout token is not needed after checkout, and leaving it in the
          # local git config is how a later step exfiltrates it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # --frozen fails if uv.lock is out of date with pyproject.toml, so a stale
      # lockfile is caught here rather than surfacing as a mystery later.
      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python ${{ matrix.python }}

      - name: Format
        if: matrix.python == '3.14'
        run: uv run ruff format --check .

      - name: Lint
        if: matrix.python == '3.14'
        run: uv run ruff check --output-format=github .

      - name: Types
        if: matrix.python == '3.14'
        run: uv run ty check

      # Runs the unit tests, every docstring example, and every fenced Python block in
      # the Markdown documentation. A documented example that no longer works fails
      # here, which is the whole point.
      - name: Tests, doctests and documentation examples
        run: uv run pytest

  windows:
    name: Tests on Windows
    # Output must be byte-identical on every platform, and Linux cannot show where it is
    # not: there, writing text never translates a line ending. On Windows it does, and
    # every file `scenet build` wrote came out with CRLF while this suite stayed green.
    # tests/test_line_endings.py checks the bytes, and only fails where they can differ.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - run: uv sync --frozen --all-groups

      - name: Tests, doctests and documentation examples
        run: uv run pytest

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - run: uv sync --frozen --group docs

      # -W turns warnings into errors: a broken cross-reference, a document missing
      # from the table of contents, or an autodoc import failure fails the build rather
      # than quietly producing a worse site.
      - name: Build the documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      # Every page must say which version it documents, where the one switcher.json is,
      # and its canonical address at the root: the version switcher, the warning banner
      # and search engines rest on them, and a build missing them looks fine on its own.
      - name: Check the documentation says its version
        run: uv run python scripts/site_versions.py check docs/_build/html

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # Runtime dependencies only: these are what ship to users. Dev tooling is
      # never distributed, so it is deliberately out of scope here. Optional extras are
      # in scope -- `pip install 'scenet[mcp]'` ships them to users just the same.
      - name: Sync runtime dependencies only
        run: uv sync --frozen --no-dev --all-extras

      - name: Check licenses are permissive
        run: |
          uv pip install pip-licenses
          # --no-sync is essential: a bare `uv run` re-syncs the project and would
          # reinstall the dev dependencies that --no-dev just pruned, silently
          # checking the wrong environment.
          uv run --no-sync pip-licenses --format=markdown --with-urls
          ALLOWED=$(grep -v '^#' .github/allowed-licenses.txt | grep -v '^$' | paste -sd ';' -)
          uv run --no-sync pip-licenses --allow-only="$ALLOWED"

  typecheck-strict:
    name: Strict type check
    runs-on: ubuntu-latest
    # ty is pre-1.0 and is documented to miss some advanced typing patterns that pyright
    # catches, so this job covers the gap. It used to be `continue-on-error: true`, which
    # meant it failed on every single run while the run itself reported green -- 92
    # findings, of which 87 were untyped third-party libraries and nobody could act on
    # any of them. A red job inside a green run teaches you to ignore CI, which is worse
    # than having no job. The rules that only fire on untyped dependencies are now off,
    # what remains is actionable, and the job blocks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run basedpyright

  examples:
    name: Gallery diagnostics
    runs-on: ubuntu-latest
    # The gallery is the language's shop window and the playground's contents. A false
    # positive here would make `scenet check` useless the first time anybody ran it, and
    # a real one means a published example does not compile.
    permissions:
      contents: read
      # Only this job, and only to upload the SARIF. Every other job in this file would
      # otherwise be able to write to the code-scanning database.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen

      # The status is captured rather than allowed to end the job, so the findings still
      # reach code scanning when there are any -- which is the case the upload exists
      # for. The job fails afterwards, at the last step.
      - name: Check the gallery
        id: check
        run: |
          set +e
          uv run scenet check --format sarif -o results.sarif \
            examples/gallery/*.panel.yaml examples/gallery/*.scene.yaml \
            examples/gallery/*.script
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # A pull request from a fork gets a read-only token, so this cannot work there and
      # is skipped rather than failed. `continue-on-error` covers the other case: a
      # repository with code scanning not enabled, where the upload is rejected and that
      # is a configuration fact rather than a problem with the examples.
      - name: Upload to code scanning
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scenet-examples

      - name: Fail if the gallery has findings
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::scenet check reported findings in examples/gallery"
          exit 1

  package:
    name: Package
    runs-on: ubuntu-latest
    # What `release.yml` checks before it publishes, checked on every pull request
    # instead: a file missing from the wheel or the sdist, or a README PyPI cannot
    # render, would otherwise show only once a tag is pushed. Nothing is published --
    # TestPyPI stays a manual rehearsal, since a pull request must never hold a
    # publishing credential.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: |
          uv build

      # PyPI refuses an upload whose description it cannot render; this is the same
      # check, run before anything is uploaded. Pinned, as every tool here is.
      - name: Check the metadata PyPI will show
        run: |
          uvx --from twine==6.1.0 twine check --strict dist/*

      - name: Smoke-test the wheel in isolation
        run: |
          cd "$(mktemp -d)"
          uv run --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl             python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

      # Whoever installs from the sdist -- a distribution packager, or pip with no wheel
      # for their platform -- builds the wheel from it alone. A file the build needs but
      # the sdist leaves out would break them and nobody else.
      - name: Build the wheel again from the sdist alone
        run: |
          uv build --wheel dist/*.tar.gz --out-dir "$RUNNER_TEMP/from-sdist"
          diff <(unzip -Z1 dist/*.whl | sort) <(unzip -Z1 "$RUNNER_TEMP"/from-sdist/*.whl | sort)

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    # The project rule is TypeScript wherever JavaScript would be used, with strict
    # enabled. That is only meaningful if something checks it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # Built as well as typechecked. The worker imports are `?worker` deep paths, which
      # `vite/client` types with a wildcard, so `tsc` passes on a monaco-editor that no
      # longer exports them -- only bundling resolves them. monaco-editor 0.57 reached
      # `main` that way, and the first thing to fail was the Pages deploy.
      - name: Playground
        working-directory: playground
        run: |
          npm ci
          npm run typecheck
          npm run test
          npx vite build

      # The step that actually assembles the playground, run here so that breaking it
      # fails a pull request rather than the Pages deploy after merge.
      #
      # That gap is not hypothetical: the wheel-freshness guard rejected every deploy
      # from 6a43750 onward while CI stayed green throughout, because `ci.yml` built the
      # documentation and `pages.yml` built the playground and only the latter ran this
      # script. Nobody looks at a workflow that does not run on their branch. (#14)
      #
      # The wheel has to exist first, and has to be built before anything imports
      # `scenet` -- the freshness check compares the two, which is the whole subject of
      # that issue.
      - name: Playground assets
        run: |
          uv build --wheel
          cd playground && npm run assets

      # Packaged exactly as `release.yml` packages it. Typechecking alone passed while
      # `vsce package` refused the manifest -- `@types/vscode` had been bumped past
      # `engines.vscode` -- and the first place that would have shown up was a release.
      # The unit tests need no editor: what the extension decides lives in modules
      # without a `vscode` import.
      - name: Editor extension
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npx --yes @vscode/vsce package --no-dependencies --out "$RUNNER_TEMP/scenet.vsix"

  editor-e2e:
    name: Editor end to end
    runs-on: ubuntu-latest
    # The extension in a real VS Code, the oldest `engines.vscode` admits: activation, a
    # check on open and on save, each finding where it belongs, gone once fixed. The unit
    # tests cover what the extension decides; only an editor covers the glue, and the
    # first run in one found the preview running `scenet` from VS Code's own install
    # directory. Headless, under a virtual display.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # The suite sets the extension to `uv run scenet`, run from the repository.
      - run: uv sync --frozen

      - name: Run the extension in VS Code
        working-directory: editor
        run: |
          npm ci
          npm run build
          xvfb-run -a npm run e2e
