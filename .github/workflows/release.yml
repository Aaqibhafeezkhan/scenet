name: Release

# Tag-driven. `uv version --bump minor`, commit, tag, push -- and the tag is the single
# source of truth for what gets published. See docs/maintainer/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Everything that can fail runs BEFORE anything is published. PyPI does not allow
  # re-uploading a version, ever, so a release that is half-done is a version number
  # burned for good.
  verify:
    name: Verify the tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Tag must match the declared version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DECLARED=$(uv version --short)
          echo "tag=$TAG declared=$DECLARED"
          if [ "$TAG" != "$DECLARED" ]; then
            echo "::error::tag v$TAG does not match project.version $DECLARED in pyproject.toml"
            exit 1
          fi

      # The same script the release job uses to produce the notes, run here so a
      # missing or empty section fails before anything is published rather than
      # producing a release with empty notes.
      - name: CHANGELOG must have a section for this version
        run: uv run --no-project python scripts/changelog_section.py "${GITHUB_REF_NAME#v}"

      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      # Proves the wheel is installable and exposes the public API, from a clean
      # environment with no project checkout on the path. `import scenet` succeeding in
      # the repository root proves nothing -- the source tree is right there. The same
      # script runs on every pull request, in `ci.yml`'s Package job.
      - name: Smoke-test the wheel in isolation
        run: |
          cd "$(mktemp -d)"
          uv run --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl             python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  extension:
    name: Package the VS Code extension
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # A .vsix is the zip a VS Code extension ships in. Attached to the release, it
      # installs via "Extensions: Install from VSIX..." with no marketplace account
      # involved anywhere -- and so no credential that can expire or leak.
      - name: Build and package
        working-directory: editor
        run: |
          npm ci
          npm run build
          npx --yes @vscode/vsce package --no-dependencies --out scenet.vsix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: editor/scenet.vsix
          if-no-files-found: error

  # The release's documentation site: its docs, its playground, its schemas and spec
  # pack. Pages serves every version from the site attached to its release -- the
  # latest at the root, each minor version under /vX.Y/ -- so this is the one build of
  # it there will ever be. Built before anything is published: a site that fails to
  # build stops the release while it can still be fixed.
  site:
    name: Build the documentation site
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: uv sync --frozen --group docs

      # The playground installs the very wheel PyPI is about to get, not a rebuild of it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      - name: Build and archive the site
        run: >-
          uv run python scripts/build_site.py --release-archive
          "site-archive/scenet-${GITHUB_REF_NAME#v}-site.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site-archive/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build, extension, site]
    runs-on: ubuntu-latest
    # Skipped until the repository variable PYPI_TRUSTED_PUBLISHER is "true".
    #
    # A trusted publisher has to be registered on pypi.org through a web form -- there
    # is no API for it, by design, because it is the thing that grants publishing
    # rights. Until that exists, this job cannot succeed, and gating it on an explicit
    # variable is better than letting every release fail on a step nobody has enabled
    # yet. Set it with:
    #
    #     gh variable set PYPI_TRUSTED_PUBLISHER --body true
    if: vars.PYPI_TRUSTED_PUBLISHER == 'true'

    # A GitHub Environment with a required reviewer. The run pauses here until a human
    # approves, so an accidental tag push cannot reach PyPI unattended.
    environment:
      name: pypi
      url: https://pypi.org/p/scenet
    permissions:
      # Set on this job only, never workflow-wide: it is the credential, and every
      # other job in this file would otherwise be able to mint one.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      # Trusted Publishing: GitHub's OIDC token is exchanged for a short-lived PyPI
      # token scoped to this one run. There is no API token to create, store, rotate
      # or leak -- the repository holds no PyPI secret of any kind.
      #
      # Attestations (PEP 740) are on by default: each artifact is signed via Sigstore
      # with this workflow's identity, so anyone can verify the file on PyPI was built
      # here and not uploaded from somebody's laptop.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create the GitHub release
    needs: [build, extension, site, publish]
    # Runs when PyPI succeeded *or* was skipped, but never after it failed. A GitHub
    # Release is a real release on its own -- the wheel is attached and installable
    # from its URL -- so it should not be held hostage to a PyPI account that has not
    # been configured. It must still not announce a version whose PyPI upload broke
    # halfway.
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.extension.result == 'success'
      && needs.site.result == 'success'
      && needs.publish.result != 'failure'
      && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: dist/

      # scenet-X.Y.Z-site.zip, which pages.yml reads every version of the site from.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/

      # The release notes are the CHANGELOG section for this version, which `verify`
      # has already confirmed exists. Written by a person, for people -- generated notes
      # are a list of commit subjects, which is not the same thing.
      #
      # This was inline awk once. It silently produced nothing: a dynamically built
      # bracket escape in an awk regex opens a character class instead of matching a
      # bracket, so the release would have been published with empty notes and no error.
      # A script can be tested; a line of awk buried in YAML cannot.
      - name: Extract the changelog section
        run: |
          python scripts/changelog_section.py "${GITHUB_REF_NAME#v}" --output release-notes.md
          cat release-notes.md

      # Tell people how to install *this* release, truthfully. If the PyPI job was
      # skipped, saying `pip install scenet` would be a lie -- the wheel attached below
      # is installable from its own URL, and that is what the notes should say.
      - name: Append installation instructions
        env:
          PUBLISHED: ${{ needs.publish.result }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MINOR="${VERSION%.*}"
          WHEEL="scenet-${VERSION}-py3-none-any.whl"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo
            echo "## Install"
            echo
            if [ "$PUBLISHED" = "success" ]; then
              printf '```bash\npip install scenet==%s\n```\n' "$VERSION"
            else
              echo "Not on PyPI yet. Install the attached wheel directly:"
              echo
              printf '```bash\npip install %s/%s\n```\n' "$BASE" "$WHEEL"
            fi
            echo
            echo "The VS Code extension is the attached scenet.vsix:"
            echo "**Extensions** -> **...** -> **Install from VSIX...**"
            echo
            # This release's own documentation, which stays when the root moves on.
            echo "[Documentation](https://creatoan.github.io/scenet/v${MINOR}/) |"
            echo "[Playground](https://creatoan.github.io/scenet/v${MINOR}/playground/)"
          } >> release-notes.md

      # Idempotent, because a release workflow gets re-run. The first v0.1.0 run
      # created the release with PyPI skipped; enabling PyPI and re-running then failed
      # here with "a release with the same tag name already exists" -- after the upload
      # to PyPI had already succeeded. A job that cannot survive being run twice turns
      # every retry into manual cleanup.
      - name: Publish or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; updating notes and assets"
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md dist/*
          fi

  # Last, and nothing waits on it: a listing that fails leaves a complete release behind,
  # and can be re-run from the Actions tab (MCP Registry -> Run workflow) without touching
  # the tag. Runs when the repository variable MCP_REGISTRY_PUBLISH is "true", as it is;
  # delete the variable to stop listing. See registry.yml for why this is a workflow
  # identity and not a person's login.
  registry:
    name: List in the MCP registry
    needs: [publish, github-release]
    if: >-
      vars.MCP_REGISTRY_PUBLISH == 'true'
      && needs.publish.result == 'success'
      && needs.github-release.result == 'success'
    permissions:
      contents: read
      id-token: write # the OIDC credential, for this job only
    uses: ./.github/workflows/registry.yml
    with:
      tag: ${{ github.ref_name }}
