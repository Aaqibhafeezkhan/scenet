name: Site backfill

# Builds the documentation site of a release made before releases carried one, and
# attaches it to that release as scenet-X.Y.Z-site.zip -- where pages.yml finds every
# version it serves. From 0.12 on, release.yml attaches it itself.
#
# By hand only: Actions -> Site backfill -> Run workflow, giving the tag. It works for
# v0.8.0 to v0.11.0; scripts/backfill_site.py says why, and refuses anything else. See
# docs/maintainer/releasing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to build the site of, such as v0.11.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Installs and builds an old release -- its npm packages, its lockfile -- so it holds
  # no permission to write anything. Attaching the result is the next job's.
  build:
    name: Build the site of ${{ inputs.tag }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release's tag, and v0.11.0's, whose site tooling the release must share.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The tag goes in through the environment, never `${{ }}` in the script: an
      # expression is spliced into the script's text before the shell reads it.
      - name: Build the release's site
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/backfill_site.py "$TAG" --out "$RUNNER_TEMP/site"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site/
          if-no-files-found: error

  attach:
    name: Attach it to the release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write # to upload the asset; nothing this job downloaded is run
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/

      # Never --clobber: a site already attached is the one Pages serves, and replacing
      # it is a decision to make by deleting it first, not a side effect of a re-run.
      - name: Upload, never replacing
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag"
            exit 1
          fi
          gh release upload "$TAG" "site/scenet-${TAG#v}-site.zip" --repo "$GITHUB_REPOSITORY"
