# The playground example gallery.
#
# Each entry is a real file in this directory, compiled by the test suite -- so the
# playground cannot offer an example that does not work.
#
# **Entries are only ever appended, never reordered or removed.** A saved draft remembers
# the example it started from by its position in this list (playground/src/persist.ts),
# and every version of the playground on the site shares that storage: moving an entry
# would reopen somebody's draft under another example's name. The order the playground
# shows is set here instead, by `groups:` and each entry's `group:`.
#
# - `groups:` the themes, in the order the menu offers them and Previous and Next walk
#   them. Within a group, entries keep the order of this list.
# - `start:` the example the playground opens on, listed first in its group.
# - `title:` a short name for the menu; the file's leading comment is the explanation.
# - `summary:` one sentence, shown under the editor.
# - `doc:` the page of docs/ that explains it, with the heading's anchor if there is one.
# - `notes:` the notes compiling and checking it give, each named once: a `scenet check`
#   rule whose level is note, or the name of a compile note (docs/howto/debug_a_layout.md).
#   Exactly those and no other, which the tests hold every example to; most give none, and
#   leave it out. The examples of "What Scenet tells you" give theirs on purpose, and each
#   ends its YAML -- a comic script, its front matter -- with a line commented out under a
#   `# Try this:` comment: deleting its `# ` makes the example an error, which the comment
#   names.

groups:
  - Start here
  - Staging and camera
  - Balloons and captions
  - Lettering and sound
  - Setting
  - Pages and sequences
  - Your own art
  - Reading direction
  - Comic scripts
  - What Scenet tells you

start: 38-tour.scene.yaml

